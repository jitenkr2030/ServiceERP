<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Services ERP</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/app.css" rel="stylesheet"></head><body class="login-page"><div class="login-card"><div class="brand-mark big">S</div><p class="eyebrow mt-3">SERVICES MANAGEMENT PLATFORM</p><h1>Welcome back</h1><p class="text-muted">Sign in to manage your business operations.</p>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<label class="form-label">Username</label>{{ form.username }}<label class="form-label mt-3">Password</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary w-100 mt-4">Sign in</button></form><small class="text-muted d-block mt-4">Secure access for your team</small></div></body></html>
